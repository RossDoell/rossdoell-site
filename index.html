<style>
  /* Pre-launch homepage is just the header and the hero: the page is locked
     to the viewport so there's nothing to scroll to, and the hero fills it
     full-bleed under the translucent header. */
  html, body{ height:100%; overflow:hidden; }
  main{ padding-top:0; }
  .hero-pin{
    /* starts below the header (rather than running under it) so the top of
       the photo, and the CN Tower's tip, is never hidden behind it */
    position:fixed; inset:var(--header-h) 0 0 0; z-index:1; overflow:hidden;
    display:flex; align-items:flex-end;
    background:var(--line);
  }
  .hero-pin-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block;
    /* keeps the CN Tower in frame at any window shape. Horizontally, it
       sits ~31% across the photo, so anchoring the crop at 31% pins it to
       the same spot on screen however narrow the window gets. Vertically,
       the photo's scaled height is 58.68vw (2800x1643) and the tower's tip
       is ~16.6% down it: when a wide, short window has to crop height, the
       crop comes off the bottom (lake) first and never takes more than 12%
       (7.04vw) off the top, so the tip always clears the edge. */
    object-position:31% calc(-1 * min(max(0px, 58.68vw - (100vh - var(--header-h))), 7.04vw));
    filter:grayscale(100%);
  }
  /* two soft gradients, not a flat block — one fading up from the bottom
     edge, one fading in from the left — so the darkest patch sits exactly
     behind the headline (bottom-left, over the lake) while the skyline and
     sky above stay unobscured as a photo in their own right */
  .hero-pin::after{
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(0deg, rgba(8,12,20,.62) 0%, rgba(8,12,20,.3) 32%, rgba(8,12,20,0) 58%),
      linear-gradient(100deg, rgba(8,12,20,.4) 0%, rgba(8,12,20,0) 42%);
  }
  .hero-pin-text{
    position:relative; z-index:1;
    padding-inline:var(--wrap-pad);
    padding-bottom:clamp(3rem, 6vw, 6rem);
    flex:0 0 min(88%, 1300px);
    max-width:min(88%, 1300px);
  }
  .hero-pin-text h1{
    font-size:clamp(3.2rem, 2.08rem + 5.12vw, 7.2rem);
    font-weight:600; letter-spacing:-0.02em; line-height:1.08;
    display:flex; flex-direction:column; gap:.05em;
    color:#fff; margin:0;
  }
  .hero-pin-text .line{ display:inline-block; opacity:0; white-space:nowrap; }
  .hero-pin-text .line-left{ animation:heroSlideLeft 10s cubic-bezier(.16,.84,.44,1) 1.111s forwards; }
  .hero-pin-text .line-right{ animation:heroSlideRight 10s cubic-bezier(.16,.84,.44,1) 3.889s forwards; }
  @media (max-width:800px){
    /* use the full width on smaller screens: the fit script scales the
       headline to its container, so more room means bigger text */
    .hero-pin-text{ flex-basis:100%; max-width:100%; padding-bottom:3rem; }
    .hero-pin::after{
      background:
        linear-gradient(0deg, rgba(8,12,20,.68) 0%, rgba(8,12,20,.32) 34%, rgba(8,12,20,0) 60%),
        linear-gradient(100deg, rgba(8,12,20,.4) 0%, rgba(8,12,20,0) 55%);
    }
  }
  @keyframes heroSlideLeft{ from{ opacity:0; transform:translateX(-70px); } to{ opacity:1; transform:translateX(0); } }
  @keyframes heroSlideRight{ from{ opacity:0; transform:translateX(70px); } to{ opacity:1; transform:translateX(0); } }

  </style>

  <div class="hero-pin">

    <div class="hero-pin-text">

  </div>

</main>

<script>
(function(){
  var h1 = document.querySelector('.hero-pin-text h1');
  var lines = document.querySelectorAll('.hero-pin-text .line');
  if(!h1 || !lines.length) return;

  function fitHero(){
    h1.style.fontSize = '';
    var container = h1.parentElement;
    if(!container) return;
    var cs = getComputedStyle(container);
    var available = container.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var baseSize = parseFloat(getComputedStyle(h1).fontSize);
    var minScale = 1;
    lines.forEach(function(line){
      var natural = line.scrollWidth;
      if(natural > available){
        var scale = available / natural;
        if(scale < minScale) minScale = scale;
      }
    });
    if(minScale < 1){
      h1.style.fontSize = (baseSize * minScale * 0.97) + 'px';
    }
  }

  fitHero();
  // re-fit once Inter has loaded: measuring with the fallback font first
  // under-sizes the lines and the headline then overflows on phones
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitHero); }
  window.addEventListener('resize', fitHero);
})();
</script>
