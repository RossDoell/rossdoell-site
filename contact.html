<style>
  /* fills the space between header and footer and centres the content in
     it, so a large window shows everything with no scrolling; when the
     window is too short for that, the page simply scrolls instead of
     clipping the form */
  .contact-main{
    display:flex; flex-direction:column;
    justify-content:center; justify-content:safe center;
    align-self:stretch; width:100%;
    /* clears the fixed 120px header (main's own padding-top would be
       overridden here) so the heading never tucks under it */
    padding-block:calc(120px + .5rem) 2.5rem;
  }
  .contact-main h1{
    font-size:clamp(2rem, 1.5rem + 3.2vw, 5.5rem);
    font-weight:600; letter-spacing:-0.02em; line-height:1.03;
    white-space:nowrap; color:var(--text-60);
    display:inline-block; opacity:0; transform-origin:center bottom;
    animation:impactLand .7s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes impactLand{
    0%{ opacity:0; transform:translateY(-46px) scale(1.18); }
    50%{ opacity:1; transform:translateY(8px) scale(0.96); }
    72%{ transform:translateY(-4px) scale(1.02); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  /* single centred column: heading, then the form at a comfortable reading
     width, with the Send button and status message centred under it */
  .contact-main{ align-items:center; text-align:center; }
  .contact-grid{ margin-top:2rem; width:100%; max-width:36rem; text-align:left; }
  .form-submit{ display:block; margin-inline:auto; }
  .form-status{ text-align:center; }
  /* on phones let the heading wrap rather than run edge to edge */
  @media (max-width:480px){ .contact-main h1{ white-space:normal; text-wrap:balance; } }

  .field{ display:flex; flex-direction:column; gap:.4rem; margin-bottom:1.75rem; }
  .field label{ font-size:.85rem; color:var(--muted); }
  .field input, .field textarea{
    font:inherit; font-size:1.05rem; color:var(--ink);
    background:transparent; border:none; border-bottom:1px solid var(--line);
    padding:.5rem 0; width:100%;
  }
  .field textarea{ resize:vertical; min-height:6.5rem; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--red); }
  .form-submit{
    margin-top:.5rem; background:var(--red); color:#fff; border:none;
    padding:.95rem 2rem; font:inherit; font-weight:600; font-size:.95rem;
    cursor:pointer; transition:background .2s ease;
  }
  .form-submit:hover{ background:var(--red-deep); }
  .form-submit:disabled{ opacity:.55; cursor:default; }
  .form-status{ margin-top:1.25rem; font-size:.95rem; }
  .form-status.error{ color:var(--red); }
  .form-status a{ color:inherit; text-decoration:underline; text-underline-offset:2px; }

</style>

<main class="wrap contact-main">
  <h1>Let's build something.</h1>

  <div class="contact-grid">
    <div>
      <form id="contact-form" novalidate>
        <div class="field">
          <label for="f-name">Name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-details">Details (email or phone)</label>
          <input id="f-details" name="details" type="text" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-message">Message</label>
          <textarea id="f-message" name="message" required></textarea>
        </div>
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
        <button class="form-submit" type="submit">Send</button>
      </form>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </div>
  </div>
</main>

<script>
(function(){
  // Inquiries are delivered to info@rossdoell.com by FormSubmit
  // (formsubmit.co), since a static page can't send email on its own.
  // The address needs a one-time activation: the first submission makes
  // FormSubmit email an "Activate Form" link to info@, and nothing is
  // delivered until someone clicks it. If the service is unreachable or
  // refuses the submission, the visitor gets a link that opens their own
  // email app with the inquiry already filled in, so nothing is lost.
  var TO = 'info@rossdoell.com';
  var ENDPOINT = 'https://formsubmit.co/ajax/' + TO;

  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');
  var submitBtn = form.querySelector('.form-submit');

  function mailtoHref(name, details, message) {
    var subject = 'New inquiry from ' + name;
    var body = 'From: ' + name + ' (' + details + ')\n\n' + message;
    return 'mailto:' + TO + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  function showFallback(name, details, message) {
    status.className = 'form-status error';
    status.textContent = "We couldn't send that just now. ";
    var a = document.createElement('a');
    a.href = mailtoHref(name, details, message);
    a.textContent = 'Email it to ' + TO + ' instead';
    status.appendChild(a);
    status.appendChild(document.createTextNode(' (your message is already filled in).'));
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = form.name.value.trim();
    var details = form.details.value.trim();
    var message = form.message.value.trim();
    if (!name || !details || !message) {
      status.className = 'form-status error';
      status.textContent = 'Please fill in all three fields.';
      return;
    }
    // hidden honeypot field: real visitors never see or fill it
    if (form._honey.value) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    status.className = 'form-status';
    status.textContent = '';

    var payload = {
      name: name,
      contact: details,
      message: message,
      _subject: 'Website inquiry from ' + name,
      _template: 'table',
      _captcha: 'false'
    };
    // lets "Reply" in the inbox go straight to the visitor when they gave an email
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(details)) payload._replyto = details;

    try {
      var res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok || String(data.success) !== 'true') throw new Error(data.message || ('HTTP ' + res.status));
      form.hidden = true;
      status.className = 'form-status';
      status.textContent = "Thanks, we've got your message and will get back to you shortly.";
    } catch (err) {
      showFallback(name, details, message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send';
    }
  });
})();
</script>
